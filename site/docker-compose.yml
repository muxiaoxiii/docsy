# Docsy 下载站（极空间 / 任意支持 Docker Compose 的环境）
#
# 用法：
#   1. 把整个 site/ 目录上传到 NAS（例如 /volume1/docker/docsy-site）
#   2. 修改 Caddyfile 中的 docsy.example.com 为你的真实域名
#   3. 导入本文件创建项目并启动（群晖 Container Manager / 极空间 Docker / docker compose up -d）
#
# 目录约定：
#   ./public         静态站点（网页本体 + data + downloads 安装包）
#   ./Caddyfile      Caddy 配置（域名、缓存、安全头）
#   ./scripts        数据同步脚本（build-data.py / sync-releases.sh）
#
# 说明：Caddy 容器以只读方式挂载 ./public，同步脚本在宿主机上写入该目录即可生效。

services:
  docsy-site:
    image: caddy:2-alpine
    container_name: docsy-site
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # 可选：邮件地址用于 Let's Encrypt 证书告警，不填也能用
      - ACME_AGREE=true

volumes:
  caddy_data:
  caddy_config:
