name: Deploy Docsy Site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'CHANGELOG.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh published download data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/muxiaoxiii/docsy/releases?per_page=100' --jq '[.[] | select(.draft == false and .prerelease == false)]' > /tmp/releases.json
          python3 site/scripts/build-data.py \
            --api-json /tmp/releases.json \
            --assets-dir site/public/downloads \
            --changelog CHANGELOG.md \
            --out site/public/data \
            --remote-only \
            --sync-fallback site/public/js/main.js

      - name: Validate site data
        run: |
          python3 -m unittest discover -s site/scripts -p 'test_*.py'
          node --test site/scripts/test-site-runtime.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
