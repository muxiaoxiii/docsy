[package]
name = "pdfcraft-filters"
description = "PDF stream filters (ISO 32000-2 §7.4): Flate, LZW, predictors, ASCII85, ASCIIHex, RunLength, CCITT Group 4 encoding and Group 3 and 4 decoding, JBIG2 encoding and decoding"
version = "0.18.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
fax = "0.3"
hayro-ccitt = "0.3"
hayro-jbig2 = { path = "../../vendor/hayro-jbig2", version = "0.3", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
thiserror = "2"
