[package]
name = "pdfcraft-crypt"
description = "PDF standard security handler (ISO 32000-2 §7.6): RC4 and AES, revisions 2–6"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[features]
proptest = []

[dependencies]
aes = "0.8"
md-5 = "0.10"
sha2 = "0.10"
stringprep = "0.1"
thiserror = "2"

[[test]]
name = "proptests"
required-features = ["proptest"]

